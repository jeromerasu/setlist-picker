[project]
name = "setlist-picker-api"
version = "0.1.0"
description = "setlist-picker FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<0.120",
    "uvicorn[standard]>=0.29",
    "structlog>=24.1",
    "pydantic-settings>=2.2",
    "pydantic[email]>=2.7",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
disallow_any_explicit = false
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
